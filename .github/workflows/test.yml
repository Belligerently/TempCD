name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: sudo apt-get update && sudo apt-get install -y zsh python3
      - run: cargo install nu --version 0.116.1 --locked
      - run: cargo fmt --check
      - run: cargo clippy --offline --all-targets -- -D warnings
      - run: python3 scripts/test.py
        env:
          TCD_REQUIRE_SHELLS: '1'
      - run: cargo build --release --locked
      - run: cargo build --locked
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: target/test-logs/
