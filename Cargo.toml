[package]
name = "tcd"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Visit a directory for one interactive command, then come back"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Belligerently/TempCD"
keywords = ["shell", "nushell", "directory", "cli"]
categories = ["command-line-utilities"]
include = ["src/**", "shells/**", "tests/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]

[profile.release]
strip = true
lto = true
codegen-units = 1
